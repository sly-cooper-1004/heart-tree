<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour Toi 💖 - L'Arbre de Cœurs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fbf3ee;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #3e2723;
      user-select: none;
    }

    .font-handwriting {
      font-family: 'Caveat', cursive;
    }

    /* Soft ambient background glow */
    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
    }

    .cursor-blink {
      display: inline-block;
      width: 2.5px;
      height: 1.1em;
      background-color: #d50000;
      margin-left: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #text-container::-webkit-scrollbar {
      width: 4px;
    }
    #text-container::-webkit-scrollbar-thumb {
      background: rgba(7, 7, 7, 0.2);
      border-radius: 8px;
    }
  </style>
</head>
<body class="relative w-screen h-screen flex flex-col justify-between items-center overflow-hidden bg-[#fbf3ee]">

  <div class="ambient-glow w-96 h-96 bg-red-200/40 top-10 right-20"></div>
  <div class="ambient-glow w-80 h-80 bg-pink-200/50 bottom-10 left-20"></div>

  <!-- Canvas Container -->
  <div class="absolute inset-0 z-10 pointer-events-none">
    <canvas id="canvas" class="w-full h-full block"></canvas>
  </div>

  <!-- Main UI Layer -->
  <main class="relative z-20 w-full h-full flex flex-col md:flex-row items-center justify-between p-6 md:p-16 pointer-events-none">
    
    <!-- Left Container for Message -->
    <div id="text-card" class="w-full md:w-5/12 lg:w-4/12 bg-white/70 backdrop-blur-md border border-red-100 rounded-3xl p-6 md:p-8 shadow-[0_15px_35px_rgba(213,0,0,0.06)] opacity-0 transform -translate-x-10 transition-all duration-1000 max-h-[80vh] flex flex-col pointer-events-auto mt-6 md:mt-0">
      
      <h1 class="text-3xl md:text-4xl font-handwriting font-bold text-[#b71c1c] mb-3 flex items-center gap-2">
        <span>Pour la meilleure des amies :</span> <span class="text-2xl animate-pulse">❤️</span>
      </h1>

      <div id="text-container" class="overflow-y-auto text-sm md:text-base leading-relaxed text-[#4e342e] font-medium space-y-3 pr-2">
        <span id="typed-text"></span><span id="cursor" class="cursor-blink"></span>
      </div>

      <div id="bottom-widget" class="mt-6 pt-4 border-t border-red-100/80 flex flex-col gap-3 hidden">
        <div class="text-xs text-[#8d6e63] font-semibold flex items-center justify-between">
          <span>Pensée pour toi en ce moment :</span>
          <span class="text-red-500 font-bold">100% Réconfort</span>
        </div>
        <button id="replay-btn" onclick="restartAnimation()" class="w-full py-2.5 px-4 bg-gradient-to-r from-[#d50000] to-[#ff1744] hover:from-[#b71c1c] hover:to-[#d50000] text-white text-xs md:text-sm font-semibold rounded-2xl shadow-md transition-all duration-300 transform hover:scale-[1.02] flex items-center justify-center gap-2 cursor-pointer pointer-events-auto">
          <span>Revoir l'arbre fleurir</span> 🌸
        </button>
      </div>
    </div>

    <!-- Right Spacer for the Tree -->
    <div class="w-full md:w-6/12 h-full pointer-events-none"></div>
  </main>

  <!-- Start Overlay for Interactive Trigger -->
  <div id="start-overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-[#fbf3ee]/90 backdrop-blur-md transition-opacity duration-700">
    <div class="text-center p-8 md:p-10 rounded-3xl bg-white border border-red-100 shadow-2xl max-w-sm mx-4 transform hover:scale-105 transition-transform duration-300">
      <div class="text-6xl mb-4 animate-bounce">💌</div>
      <h2 class="text-3xl font-bold font-handwriting text-[#b71c1c] mb-2">Un message pour toi...</h2>
      <p class="text-sm text-[#6d4c41] mb-6">J'ai fait ce code pour te redonner le sourire.</p>
      <button id="start-btn" class="w-full py-3.5 px-6 bg-gradient-to-r from-[#d50000] to-[#ff5252] hover:from-[#b71c1c] hover:to-[#d50000] rounded-2xl font-bold text-white shadow-[0_8px_20px_rgba(213,0,0,0.3)] transition-all">
        Découvrir le message ❤️
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      groundY = height - 80;
    });

    let groundY = height - 80;
    let state = 'IDLE'; // IDLE, RISING_HEART, EXPLOSION, SEED_FALL, TREE_GROW, TREE_SHIFT, FLOATING_HEART, TYPING
    let animFrame;

    // Animation progress variables
    let bigHeartScale = 1;
    let smallHeartY = height + 50;
    let particles = [];
    let seed = { x: width / 2, y: height / 2 - 50, vy: 0, radius: 8 };
    let groundLineProgress = 0;

    // Tree parameters
    let treeBranches = [];
    let heartLeaves = [];
    let treeOffsetX = 0;
    let targetTreeOffsetX = 0;
    let leavesFalling = [];

    // Floating heart
    let floatingHeart = { x: width + 50, y: height * 0.4, vx: -2.5, scale: 1, stopped: false };

    // Text to type out
    const comfortingMessage = [
      "J'ai remarqué que ce n'est pas très facile pour toi en ce moment...",
      "Je voulais te rappeler à quel point tu es formidable à mes yeux et aux yeux de DIEU Jo.",
      "Tu es courageuse, forte et par dessus tout, importante. Tu as le droit d'exister ❤️",
      "N'oublie jamais cela ! Peu importe ce que l'Homme peut dire .",
      "Je suis là pour toi, peu importe la situation ! Tu es le modèle parfait. 💖"
    ];

    let currentMsgIdx = 0;
    let currentCharIdx = 0;

    function drawHeart(x, y, size, color, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.translate(x, y);
      ctx.scale(size / 20, size / 20);
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-10, -10, -20, 5, 0, 20);
      ctx.bezierCurveTo(20, 5, 10, -10, 0, 0);
      ctx.fill();
      ctx.restore();
    }

    function createExplosion(x, y) {
      particles = [];
      const colors = ['#FF0000', '#ff758f', '#ffb3c1', '#ffffff', '#ff85a1'];
      for (let i = 0; i < 70; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 12 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.02 + 0.01
        });
      }
    }

    class Branch {
      constructor(x, y, angle, length, width, depth) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.length = length;
        this.currentLength = 0;
        this.width = width;
        this.depth = depth;
        this.children = [];
        this.grown = false;
        this.endX = x + Math.cos(angle) * length;
        this.endY = y + Math.sin(angle) * length;
      }

      grow() {
        if (this.currentLength < this.length) {
          this.currentLength += this.length * 0.03;
          if (this.currentLength >= this.length) {
            this.currentLength = this.length;
            this.grown = true;
            this.generateChildren();
          }
        } else {
          this.children.forEach(child => child.grow());
        }
      }

      generateChildren() {
        if (this.depth <= 0) return;
        const count = Math.random() > 0.3 ? 2 : 3;
        for (let i = 0; i < count; i++) {
          const spread = (Math.PI / 4) * (Math.random() * 0.8 + 0.6);
          const newAngle = this.angle + (i - (count - 1) / 2) * spread + (Math.random() - 0.5) * 0.2;
          const newLength = this.length * (Math.random() * 0.25 + 0.65);
          const newWidth = this.width * 0.7;
          this.children.push(new Branch(this.endX, this.endY, newAngle, newLength, newWidth, this.depth - 1));
        }
      }

      draw(offsetX = 0) {
        const curX = this.x + Math.cos(this.angle) * this.currentLength;
        const curY = this.y + Math.sin(this.angle) * this.currentLength;

        ctx.strokeStyle = '#832C21';
        ctx.lineWidth = this.width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(this.x + offsetX, this.y);
        ctx.lineTo(curX + offsetX, curY);
        ctx.stroke();

        this.children.forEach(child => child.draw(offsetX));

        // Add leaves at terminal branches or deep nodes
        if (this.depth <= 2 && this.grown) {
          const leafX = curX + offsetX;
          const leafY = curY;
          if (!this.leafAdded) {
            this.leafAdded = true;
            heartLeaves.push({
              x: leafX,
              y: leafY,
              baseOffsetX: leafX - (width / 2 + offsetX),
              size: 0,
              maxSize: Math.random() * 10 + 10,
              color: ['#FF0000', '#ff758f', '#ff85a1', '#ff1493'][Math.floor(Math.random() * 4)],
              alpha: Math.random() * 0.4 + 0.6
            });
          }
        }
      }
    }

    let rootBranch;

    function initTree() {
      treeBranches = [];
      heartLeaves = [];
      leavesFalling = [];
      const startX = width / 2;
      const startY = groundY;
      rootBranch = new Branch(startX, startY, -Math.PI / 2, height * 0.18, 12, 6);
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      // 1. Draw ground line if active
      if (groundLineProgress > 0) {
        ctx.strokeStyle = 'rgba(255, 182, 193, 0.4)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const startX = width / 2 - (width * 0.4 * groundLineProgress);
        const endX = width / 2 + (width * 0.4 * groundLineProgress);
        ctx.moveTo(startX, groundY);
        ctx.lineTo(endX, groundY);
        ctx.stroke();
      }

      // STATE 1: Rising heart towards main heart
      if (state === 'RISING_HEART') {
        const centerX = width / 2;
        const centerY = height / 2 - 50;

        // Draw Big Heart
        drawHeart(centerX, centerY, 60 * bigHeartScale, '#FF0000');
        // Connecting line
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY + 30);
        ctx.lineTo(centerX, smallHeartY);
        ctx.stroke();

        // Draw Small Heart
        drawHeart(centerX, smallHeartY, 25, '#ff85a1');

        smallHeartY -= 4;

        if (smallHeartY <= centerY + 20) {
          state = 'EXPLOSION';
          createExplosion(centerX, centerY);
        }
      }

      // STATE 2: Explosion of particles
      else if (state === 'EXPLOSION') {
        let alive = false;
        particles.forEach(p => {
          if (p.alpha > 0) {
            alive = true;
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.decay;
            drawHeart(p.x, p.y, p.size, p.color, Math.max(0, p.alpha));
          }
        });

        if (!alive) {
          state = 'SEED_FALL';
          seed.x = width / 2;
          seed.y = height / 2 - 50;
          seed.vy = 2;
        }
      }

      // STATE 3: Seed falling to ground
      else if (state === 'SEED_FALL') {
        seed.y += seed.vy;
        seed.vy += 0.3; // gravity

        // Draw red glowing seed
        ctx.shadowColor = '#FF0000';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#FF0000';
        ctx.beginPath();
        ctx.arc(seed.x, seed.y, seed.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Animate ground line expanding
        if (groundLineProgress < 1) {
          groundLineProgress += 0.05;
        }

        if (seed.y >= groundY) {
          state = 'TREE_GROW';
          initTree();
        }
      }

      // STATE 4: Tree Growing
      else if (state === 'TREE_GROW') {
        rootBranch.grow();
        rootBranch.draw(0);

        // Grow heart leaves
        heartLeaves.forEach(leaf => {
          if (leaf.size < leaf.maxSize) leaf.size += 0.4;
          drawHeart(leaf.x, leaf.y, leaf.size, leaf.color, leaf.alpha);
        });

        // Check if tree grown enough - augmented heart count
        if (heartLeaves.length > 50 && heartLeaves.every(l => l.size >= l.maxSize - 1)) {
          setTimeout(() => {
            state = 'TREE_SHIFT';
            targetTreeOffsetX = width > 768 ? width * 0.22 : width * 0.15; // Shift right
          }, 600);
        }
      }

      // STATE 5: Tree Shift & Leaves Falling
      else if (state === 'TREE_SHIFT' || state === 'FLOATING_HEART' || state === 'TYPING') {
        if (Math.abs(treeOffsetX - targetTreeOffsetX) > 0.5) {
          treeOffsetX += (targetTreeOffsetX - treeOffsetX) * 0.03;
        } else {
          if (state === 'TREE_SHIFT') {
            state = 'FLOATING_HEART';
            showTextCard();
          }
        }

        rootBranch.draw(treeOffsetX);

        // Draw Leaves with shift
        heartLeaves.forEach((leaf, idx) => {
          const currentX = width / 2 + treeOffsetX + leaf.baseOffsetX;
          drawHeart(currentX, leaf.y, leaf.size, leaf.color, leaf.alpha);

          // Randomly trigger a falling leaf
          if (Math.random() < 0.002 && leavesFalling.length < 8) {
            leavesFalling.push({
              x: currentX,
              y: leaf.y,
              vx: (Math.random() - 0.5) * 1.5,
              vy: Math.random() * 1.5 + 1,
              size: leaf.size * 0.8,
              color: leaf.color,
              alpha: 1,
              rotation: 0
            });
          }
        });

        // Update and draw falling leaves
        leavesFalling.forEach((fl, idx) => {
          fl.x += fl.vx + Math.sin(fl.y * 0.05);
          fl.y += fl.vy;
          fl.alpha -= 0.005;
          drawHeart(fl.x, fl.y, fl.size, fl.color, Math.max(0, fl.alpha));

          if (fl.y > groundY || fl.alpha <= 0) {
            leavesFalling.splice(idx, 1);
          }
        });
      }

      // STATE 6 & 7: Floating Heart coming from right
      if (state === 'FLOATING_HEART' || state === 'TYPING') {
        if (!floatingHeart.stopped) {
          floatingHeart.x += floatingHeart.vx;
          floatingHeart.y += Math.sin(floatingHeart.x * 0.02) * 1.2;

          drawHeart(floatingHeart.x, floatingHeart.y, 30, '#FF0000');

          // Stop near center-right
          if (floatingHeart.x <= width * 0.65) {
            floatingHeart.stopped = true;
            createExplosion(floatingHeart.x, floatingHeart.y);
            state = 'TYPING';
            startTyping();
          }
        } else {
          // Draw particles from floating heart explosion
          particles.forEach(p => {
            if (p.alpha > 0) {
              p.x += p.vx * 0.5;
              p.y += p.vy * 0.5;
              p.alpha -= p.decay;
              drawHeart(p.x, p.y, p.size, p.color, Math.max(0, p.alpha));
            }
          });
        }
      }

      animFrame = requestAnimationFrame(animate);
    }

    function showTextCard() {
      const card = document.getElementById('text-card');
      card.classList.remove('opacity-0', '-translate-x-10');
      card.classList.add('opacity-100', 'translate-x-0');
    }

    function startTyping() {
      const textElem = document.getElementById('typed-text');
      
      function typeNextChar() {
        if (currentMsgIdx < comfortingMessage.length) {
          const currentLine = comfortingMessage[currentMsgIdx];
          if (currentCharIdx < currentLine.length) {
            textElem.innerHTML += currentLine.charAt(currentCharIdx);
            currentCharIdx++;
            setTimeout(typeNextChar, 45); // Typing speed
          } else {
            textElem.innerHTML += '<br><br>';
            currentMsgIdx++;
            currentCharIdx = 0;
            setTimeout(typeNextChar, 600); // Pause between paragraphs
          }
        } else {
          // Finish typing
          document.getElementById('cursor').style.display = 'none';
          document.getElementById('bottom-widget').classList.remove('hidden');
        }
      }

      typeNextChar();
    }

    function startExperience() {
      const overlay = document.getElementById('start-overlay');
      overlay.classList.add('opacity-0');
      setTimeout(() => {
        overlay.style.display = 'none';
        state = 'RISING_HEART';
        animate();
      }, 700);
    }

    function restartAnimation() {
      cancelAnimationFrame(animFrame);
      state = 'RISING_HEART';
      bigHeartScale = 1;
      smallHeartY = height + 50;
      particles = [];
      groundLineProgress = 0;
      treeOffsetX = 0;
      targetTreeOffsetX = 0;
      floatingHeart = { x: width + 50, y: height * 0.4, vx: -2.5, scale: 1, stopped: false };
      
      currentMsgIdx = 0;
      currentCharIdx = 0;
      document.getElementById('typed-text').innerHTML = '';
      document.getElementById('cursor').style.display = 'inline-block';
      document.getElementById('bottom-widget').classList.add('hidden');

      animate();
    }

    document.getElementById('start-btn').addEventListener('click', startExperience);
  </script>
</body>
</html>
